<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZEUS Terminal · 登录 Log in</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZEUS">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="robots" content="noindex">
<style>
:root{--bg:#0d1117;--bg2:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--red:#f85149;--accent:#1f6feb;--gold:#e3b341}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
main{width:100%;max-width:380px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:26px 22px}
.brand{font-weight:800;letter-spacing:2px;font-size:18px}
.brand span{color:var(--gold);margin-left:6px;letter-spacing:1px}
p{color:var(--text2);font-size:13.5px;margin:10px 0 18px}
p .en{display:block;font-size:12.5px;margin-top:2px}
label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
input{width:100%;font:600 22px/1.2 ui-monospace,Menlo,monospace;letter-spacing:3px;text-transform:uppercase;text-align:center;
  background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;margin-top:14px;font:600 15px/1 inherit;font-family:inherit;padding:13px;border-radius:8px;border:1px solid var(--accent);
  background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
#msg{min-height:20px;color:var(--red);font-size:13px;margin-top:12px;text-align:center}
.foot{color:var(--text2);font-size:12px;margin-top:18px;border-top:1px solid #21262d;padding-top:12px}
</style>
</head>
<body>
<main>
  <div class="brand">ZEUS<span>宙斯期权终端</span></div>
  <p>输入电脑上 ⚙ 设置 → 手机访问 里显示的访问码。这台设备只需登录一次。
    <span class="en">Enter the access code shown on your computer in ⚙ Settings → Phone access. Once per device.</span></p>
  <form id="f" autocomplete="off">
    <label for="code">访问码 · Access code</label>
    <input id="code" name="code" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false"
           maxlength="12" placeholder="XXXX-XXXX" required>
    <button id="go" type="submit">登录 · Log in</button>
    <div id="msg" role="status"></div>
  </form>
  <div class="foot">登录后，iPhone：Safari → 分享 → 添加到主屏幕；Android：Chrome → ⋮ → 安装应用。<br>
    After logging in, iPhone: Safari → Share → Add to Home Screen; Android: Chrome → ⋮ → Install app.</div>
</main>
<script>
(function () {
  'use strict';
  var f = document.getElementById('f'), input = document.getElementById('code'),
      btn = document.getElementById('go'), msg = document.getElementById('msg');
  var next = new URLSearchParams(location.search).get('next') || '/';
  var ERR = {
    wrong_code: '访问码不对 · Wrong access code',
    too_many: '试错太多次，请 {s} 秒后再试 · Too many tries, wait {s} s',
    off: '电脑上的手机访问已关闭 · Phone access is off on the computer',
    net: '连不上电脑上的 ZEUS · Cannot reach ZEUS on the computer'
  };
  function send() {
    btn.disabled = true; msg.textContent = '';
    fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
                      body: JSON.stringify({ code: input.value, next: next }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { r: r, j: j }; }); })
      .then(function (x) {
        if (x.r.ok) { location.replace(x.j.next || '/'); return; }
        msg.textContent = (ERR[x.j.error] || ('✗ ' + x.r.status)).replace(/\{s\}/g, x.j.retry_after || 60);
        btn.disabled = false; input.select();
      })
      .catch(function () { msg.textContent = ERR.net; btn.disabled = false; });
  }
  f.addEventListener('submit', function (e) { e.preventDefault(); send(); });
  // The QR code in Settings carries the code after "#", which never leaves this phone.
  var m = /[#&]code=([^&]+)/.exec(location.hash);
  if (m) {
    input.value = decodeURIComponent(m[1]);
    history.replaceState(null, '', location.pathname + location.search);
    send();
  } else {
    input.focus();
  }
})();
</script>
</body>
</html>
