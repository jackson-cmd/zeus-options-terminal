name: Website

# The project page at https://jackson-cmd.github.io/zeus-options-terminal/ (site/), with the
# screenshots copied in from docs/screenshots and the share cards from docs/assets at build
# time, so each picture is stored only once. site/llms.txt is the plain-text map that AI search
# tools read. After each deploy, the sitemap's pages go to IndexNow (Bing and others).
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/screenshots/**", "docs/assets/social*.png", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Add the screenshots and the share cards
        run: |
          cp -R docs/screenshots site/screenshots
          cp docs/assets/social.png site/social.png
          cp docs/assets/social_zh.png site/social_zh.png
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Tell Bing and the other IndexNow search engines which pages changed
        # IndexNow needs no account: the engines check that the key file site/<key>.txt is on the
        # site (the key is public by design). Best effort, so a refused ping never fails the deploy.
        continue-on-error: true
        env:
          INDEXNOW_KEY: 0798c5080ad3272dc37d3c67d2de5d7d
          SITE_URL: https://jackson-cmd.github.io/zeus-options-terminal/
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          site, key = os.environ["SITE_URL"], os.environ["INDEXNOW_KEY"]
          urls = re.findall(r"<loc>([^<]+)</loc>", open("site/sitemap.xml", encoding="utf-8").read())
          body = {"host": site.split("/")[2], "key": key, "keyLocation": f"{site}{key}.txt", "urlList": urls}
          request = urllib.request.Request("https://api.indexnow.org/indexnow", data=json.dumps(body).encode(),
                                           headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"IndexNow answered {response.status} for {len(urls)} pages")
          PY
